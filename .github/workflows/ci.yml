name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-guard:
    name: Vendored schema guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block hand-edits to vendored schemas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- schemas/)"
          if [ -z "$changed" ]; then
            echo "No changes under schemas/. OK."
            exit 0
          fi
          echo "Changed vendored schema files:"
          echo "$changed"
          has_label="$(jq -r '([.pull_request.labels[].name] | index("schema-upgrade")) != null' "$GITHUB_EVENT_PATH")"
          if [ "$has_label" != "true" ]; then
            echo "::error::Files under schemas/ are vendored (see CONTRIBUTING.md) and must not be hand-edited. If this is an intentional, reviewed schema upgrade, add the 'schema-upgrade' label to this PR to acknowledge and unblock this check."
            exit 1
          fi
          echo "PR is labeled 'schema-upgrade' — allowing vendored schema change."

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK (pinned by global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx', 'Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SbeB3Exchange.slnx

      - name: Build (Release, warnings-as-errors)
        run: dotnet build SbeB3Exchange.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test SbeB3Exchange.slnx
          --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*
          if-no-files-found: ignore
          retention-days: 14

  build-test-debug:
    name: Build & Test (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    # Debug builds enforce single-thread invariants (MatchingEngine /
    # ChannelDispatcher) via Debug.Assert, which compiles out in
    # Release. Two latent bugs (#374 dispatcher async-loop continuation
    # hop; #375 test-thread hop) were silently green in Release CI
    # for months. This lane catches that whole family on every PR.
    # Kept as a SEPARATE job (not a matrix) so the existing required
    # check "Build & Test" name remains stable for branch protection /
    # auto-merge until this lane is promoted to required.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK (pinned by global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx', 'Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SbeB3Exchange.slnx

      - name: Build (Debug, warnings-as-errors)
        run: dotnet build SbeB3Exchange.slnx --no-restore -c Debug

      - name: Test (Debug)
        run: >
          dotnet test SbeB3Exchange.slnx
          --no-build -c Debug
          --logger "trx;LogFileName=test-results-debug.trx"
          --logger "console;verbosity=normal"
          --blame-hang-timeout 60000
          --results-directory ./TestResults

      - name: Upload test results (Debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-debug
          path: TestResults/**/*
          if-no-files-found: ignore
          retention-days: 14

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK (pinned by global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (needed by dotnet format)
        run: dotnet restore SbeB3Exchange.slnx

      - name: dotnet format --verify-no-changes
        run: dotnet format SbeB3Exchange.slnx --verify-no-changes --no-restore --severity warn
